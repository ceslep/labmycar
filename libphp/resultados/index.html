<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de resultados de laboratorio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"
        integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.8/dist/sweetalert2.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.8/dist/sweetalert2.all.min.js"></script>
    <style>
        .container {
            height: 100dvh;
            width: 80dvw;
        }

        .fs-7 {
            font-size: 0.8rem;
        }
    </style>
</head>

<body>
    <div class="container-fluid resultados">
    <div class="container d-flex justify-content-center align-items-center">
        <div class="card text-center">
            <div class="card-header">
                Laboratorio Clínico.
            </div>
            <div class="card-body">
                <h5 class="card-title">Consulta de Resultados</h5>
                <img src="../printphp/logo.png" alt="logo" width="50%">
                <form id="frmConsulta">
                    <div class="form-group">
                        <input type="text" name="identificacion" class="form-control"
                            placeholder=" Ingrese el número de identificación">
                    </div>
                    <div class="form-group pt-2">
                        <input type="text" name="numero" class="form-control"
                            placeholder="Ingrese el año de nacimiento ">
                    </div>
                    <div class="text-center fs-7">O últimos 4 digitos del celular</div>
                    <button type="submit" class="btn btn-primary mt-3">Consultar<span
                            class="mx-2 spinner-border spinner-border-sm d-none" aria-hidden="true"></span></button>
                </form>
            </div>
            <div class="card-footer text-body-secondary" id="year">

            </div>
        </div>

    </div>
    </div>
</body>
<script>
    document.getElementById("year").textContent = (new Date()).getFullYear();

    const generarResultados = (resultados) => {
        if (resultados.length == 0) return 'No se encontraron resultados  <a class="btn btn-info mt-2" href="/resultados">Otra Consulta</a> ';
        const spn = `<div class="spinner-border spinner-border-sm d-none" role="status">
  <span class="visually-hidden">Loading...</span>
</div>`;
        let html = `<table class='table table-bordered table-hover caption-top'>
    <thead class="bg-primary text-white">
        <caption>
            <a class="btn btn-info" href="/resultados">Otra Consulta</a>
            ${resultados[0].nombres}-${resultados[0].identificacion} </caption>
      <tr>
        <th scope="col"  >N°</th>
          <th scope="col"  >Examen</th>
          <th scope="col" >Fecha del Exámen </th>
          <th scope="col" >Ver</th>
      </tr>
      </thead>
      <tbody>
    `;
        resultados.forEach((value, index, array) => {
            const { examen, fecha,identificacion,nombres,tabla,info,edad } = value;
            const href=`/printphp/print_examen.php?identificacion=${identificacion}&fecha=${fecha}&nombres=${nombres}&tabla=${tabla}&info=${info}&ver=1&edad=${edad}`;    
            html += `
            <tr>
                <td class="align-middle text-center">
                    ${index + 1}
                </td>
                <td class="align-middle">
                    ${examen}
                </td>
                <td class="align-middle  text-center">
                    ${fecha}
                </td>
                <td class="align-middle text-center">
                    <a class="btn btn-sm btn-danger btnEx" href='${href}'}' target='_blank'><i class="bi bi-eye-fill"></i>${spn}</a>
                </td>
            </tr>    
        `;
        });
        html += `
        </tbody>
        </table>
    `;
        return html;
    }

    document.getElementById("frmConsulta").addEventListener('submit', async e => {
        e.preventDefault();
        const spn = e.target.children[3].children[0];
        spn.classList.toggle("d-none");
        const datos = Object.fromEntries(new FormData(e.currentTarget));
        const response = await fetch("../getExamenesPaciente2.php", {
            method: "POST",
            body: JSON.stringify(datos),
        });
        const data = await response.json();
        console.log(data);
        spn.classList.toggle("d-none");
        document.querySelector(".resultados").innerHTML = await generarResultados(data);
    });
</script>

</html>
